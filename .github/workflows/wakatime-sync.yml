name: Sync WakaTime to GitHub Project

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      shas:
        description: "Commit SHAs to backfill (comma or whitespace separated) — use when a push never triggered its own run"
        required: true
        type: string

jobs:
  sync-hours:
    name: Sync hours to project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Build commits JSON from manual input
        id: manual-commits
        if: github.event_name == 'workflow_dispatch'
        run: node .github/scripts/build-commits-json.mjs "${{ inputs.shas }}"

      - name: Sync
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          COMMITS_JSON: ${{ github.event_name == 'workflow_dispatch' && steps.manual-commits.outputs.commits_json || toJson(github.event.commits) }}
          BRANCH_NAME: ${{ github.ref_name }}
          WAKATIME_PROJECT_NAME: ${{ vars.WAKATIME_PROJECT_NAME }}
          TIME_FIELD_NAME: ${{ vars.TIME_FIELD_NAME }}
          START_DATE_FIELD_NAME: ${{ vars.START_DATE_FIELD_NAME }}
          END_DATE_FIELD_NAME: ${{ vars.END_DATE_FIELD_NAME }}
        run: node .github/scripts/sync-wakatime.mjs
